[project]
name = "a2a-mcp-warehouse-demo"
version = "0.2.0b0"
description = "When to use MCP vs A2A: a measured data-warehouse demo."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk[a2a]==2.12.0",
    "a2a-sdk[http-server]",
    "mcp",
    "duckdb==1.5.6",
    "sqlglot==30.22.0",
    "pandas==3.0.6",
    "fastapi",
    "uvicorn",
    "httpx",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["demo-app/tests", "test-app/tests"]
asyncio_mode = "auto"
